name: ✅ CI

# Gates qualité exécutés sur CHAQUE PR (et sur la branche principale).
#
# ✅ REQUIS ET BLOQUANTS depuis le 2026-07-28 (US-00.7). La protection de branche est APPLIQUÉE :
#    3 des 4 status checks REQUIS de main sont portés par ce fichier — "🔐 Secrets scan (gitleaks)",
#    "📋 Governance (SCB + traçabilité + synchro)", "📱 App (gates run_gates.py)" — le 4e étant
#    "check-branch-name" (branch-naming.yml). La fusion est CONDITIONNÉE aux 4 verts,
#    ADMINISTRATEUR INCLUS (enforce_admins en vigueur → enforcement_level "everyone").
#    Le serveur énumère lui-même les contextes requis : "4 of 4 required status checks are expected"
#    (reports/US-00.7/applied_state/negative_test_server.txt).
#    ✅ REFUS DE FUSION PROUVÉ PAR LE SERVEUR le 2026-07-29 (PR #14, T11 EXÉCUTÉE) : un PUT sur
#    .../pulls/14/merge avec 1/4 contexte vert rend HTTP 405, "3 of 4 required status checks are
#    expected" — c'est l'API REST qui refuse, administrateur inclus, sans --admin. Le refus d'écriture
#    directe (GH006) est prouvé de son côté depuis le 2026-07-28. Preuves :
#    reports/US-00.7/applied_state/merge_refusal_server_405.txt et negative_test_server.txt.
#    ⚠️ BORNE MAINTENUE : le refus observé porte sur des contextes `expected`, PAS `failing` — la
#    conjonction littérale d'US-00.1 ("secrets-scan ROUGE -> merge empêché") reste non observée, et
#    on ne cassera pas un gate pour l'obtenir.
#    Source unique des libellés : factory.config.json → status_checks.
#
# ⛔ NE JAMAIS MODIFIER un `name:` de job de ce fichier sans mettre à jour factory.config.json
#    dans le MÊME changement : un libellé divergent d'un seul caractère produit un contexte requis
#    JAMAIS RAPPORTÉ, donc un VERROUILLAGE — plus aucune PR fusionnable, administrateur inclus.
#    Porte de sortie : docs/GIT_PROTECTION.md §Plan de retour arrière.
#
# ⚠️ CONDITIONNEL : l'enforcement dépend de la VISIBILITÉ PUBLIQUE du dépôt. Un retour en privé
#    ramènerait le 403 de plan et ces jobs redeviendraient seulement RAPPORTÉS. La vérification de
#    l'état réel se fait HORS CI (droits admin absents du GITHUB_TOKEN) : voir la commande de
#    comparaison distante documentée dans docs/GIT_PROTECTION.md §Vérification de l'état réel.
#    ⛔ Ne JAMAIS ajouter cette commande à un workflow : elle produirait un faux rouge permanent, et
#    un contrôle négatif du Story File US-00.4/US-00.7 vérifie son absence de .github/workflows/.
#    Détail : docs/GIT_PROTECTION.md · docs/adr/ADR-007-application-protection-branche.md
#    (remplace ADR-006).
#
# Constitution : docs/governance/CONSTITUTION.md.

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: 🔐 Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action@v2, sur un événement pull_request, appelle l'API GitHub
    # (ScanPullRequest : énumération des commits + résumé de PR). Sans permissions
    # explicites, le GITHUB_TOKEN par défaut est restreint → "Resource not accessible
    # by integration". Ce bloc accorde le strict nécessaire (les autres permissions
    # passent à none). N'affecte pas l'identité du status check.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  governance:
    name: 📋 Governance (SCB + traçabilité + synchro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ⚠️ actionlint est un STEP de ce job, et NON un job séparé — c'est délibéré.
      #    Un nouveau job ne serait PAS un contexte requis (les 4 contextes requis sont
      #    figés dans factory.config.json, fichier Art. 6) : il serait donc RAPPORTÉ sans
      #    BLOQUER — exactement l'anti-pattern qu'US-00.4 et US-00.7 ont établi puis
      #    supprimé. Placé ici, dans un job DÉJÀ REQUIS, un lint rouge fait échouer
      #    « 📋 Governance » et empêche réellement la fusion.
      #    Origine : recommandation de l'audit sécurité d'US-00.7 (2026-07-28), qui a
      #    identifié l'absence d'actionlint comme la CAUSE RACINE du finding B-1.
      #    Épinglage : version ET empreinte SHA256 codées en dur. Si l'asset publié est
      #    un jour remplacé, `sha256sum -c` échoue et la CI s'arrête — c'est voulu.
      #    ⚠️ CONTREPARTIE ASSUMÉE (finding N-1 du re-audit sécurité d'US-00.7) : si
      #    l'asset devient INDISPONIBLE (release supprimée, incident CDN), ce job REQUIS
      #    échoue sur TOUTE PR, et corriger exigerait de fusionner une PR qui exige ce
      #    même contexte — c'est CIRCULAIRE. La sortie est documentée : voir la 4e ligne
      #    du tableau §Plan de retour arrière de docs/GIT_PROTECTION.md (ADMINISTRER la
      #    règle, ce qui n'est PAS la contourner). Risque faible et AUTO-RÉVÉLATEUR : il
      #    se manifeste à la première PR, jamais silencieusement. Même propriété, en pire,
      #    pour le `pip install jsonschema` NU quelques lignes plus bas (finding N-2).
      - name: 🔎 Lint des workflows (actionlint, épinglé par SHA256)
        run: |
          set -euo pipefail
          VERSION=1.7.12
          SHA256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
          rm -f actionlint actionlint.tar.gz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation deps
        run: pip install jsonschema
      - name: SCB compliance
        run: python scripts/check_scb_compliance.py
      - name: Trace validation
        run: python scripts/validate_trace.py --all
      - name: Synchro config (status checks ↔ CI ↔ seuils de l'adapter)
        run: python scripts/factory_sync.py --check

  app-quality:
    name: 📱 App (gates run_gates.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Gates app (format, analyze, test, deps_audit, build)
        run: python scripts/run_gates.py --component app
