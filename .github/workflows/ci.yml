name: ✅ CI

# Gates qualité exécutés et RAPPORTÉS sur CHAQUE PR (et sur la branche principale).
#
# ⚠️ RAPPORTÉS, PAS BLOQUANTS — constat daté du 2026-07-26 : aucun de ces jobs n'est un status
#    check REQUIS, parce que `main` n'est PAS protégée et ne peut pas l'être sur ce plan
#    (dépôt privé, compte User : GET/PUT .../protection ET .../rulesets renvoient 403
#    « Upgrade to GitHub Pro or make this repository public to enable this feature. »).
#    Conséquence à assumer : une PR peut être fusionnée AVEC LA CI ROUGE. Il faut donc LIRE
#    activement les checks (`gh pr checks`) — aucune barrière machine ne le fera.
#    Ces 4 jobs sont les contextes de la CIBLE ARMÉE (factory.config.json → status_checks),
#    destinés à devenir requis LE JOUR DU DÉBLOCAGE, via scripts/apply_branch_protection.sh
#    (PRÊT mais NON APPLICABLE aujourd'hui).
#    Détail : docs/GIT_PROTECTION.md · docs/adr/ADR-006-protection-branche-principale.md.
#
# Constitution : docs/governance/CONSTITUTION.md.

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: 🔐 Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action@v2, sur un événement pull_request, appelle l'API GitHub
    # (ScanPullRequest : énumération des commits + résumé de PR). Sans permissions
    # explicites, le GITHUB_TOKEN par défaut est restreint → "Resource not accessible
    # by integration". Ce bloc accorde le strict nécessaire (les autres permissions
    # passent à none). N'affecte pas l'identité du status check.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  governance:
    name: 📋 Governance (SCB + traçabilité + synchro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation deps
        run: pip install jsonschema
      - name: SCB compliance
        run: python scripts/check_scb_compliance.py
      - name: Trace validation
        run: python scripts/validate_trace.py --all
      - name: Synchro config (status checks ↔ CI ↔ seuils de l'adapter)
        run: python scripts/factory_sync.py --check

  app-quality:
    name: 📱 App (gates run_gates.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Gates app (format, analyze, test, deps_audit, build)
        run: python scripts/run_gates.py --component app
