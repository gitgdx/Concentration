<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        body {
            background-color: #1b110c;

        .temporal-gradient-3 { background-color: #aac7ff; }
        .temporal-gradient-4 { background-color: #005ab3; } /* Blue - Far */

        .fade-out {
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 1.2s ease, transform 1.2s ease;
            pointer-events: none;
        }

        .ghost-entry {
            opacity: 0.15;
            filter: grayscale(1);
        }

        .ready-to-glance {
            transition: background-color 0.8s ease-in-out;

<body class="font-description-md text-description-md">
<!-- TopAppBar -->
<header class="w-full top-0 bg-background flex items-center justify-between px-lg py-md w-full sticky z-10">
<div class="flex items-center gap-sm">

</div>
<div class="flex items-center gap-md">
<button class="hover:opacity-80 transition-opacity text-on-surface-variant">

<main class="max-w-2xl mx-auto px-container-margin pt-lg pb-xl space-y-xl">
<!-- Hub de Pratiques: Échéances -->
<section class="space-y-md">
<div class="grid grid-cols-2 md:grid-cols-3 gap-tile-gutter" id="tile-container">
<!-- Tile 1: Project (Orange - Urgent/Near) -->
<div class="temporal-gradient-1 text-on-primary-container p-lg aspect-square flex flex-col justify-between rounded-xl ready-to-glance cursor-default group" ondblclick="this.classList.add('fade-out')" style="opacity: 1; transform: translateY(0px); transition: opacity 0.8s, transform 0.8s;">
<div class="mt-auto">
<span class="font-tile-number-mobile md:font-tile-number text-tile-number-mobile md:text-tile-number block">3</span>
</div>
<p class="font-label-sm text-label-sm opacity-80 uppercase tracking-widest mt-sm">Préparation du projet</p>
</div>
<!-- Tile 2: Voyage (Medium) -->
<div class="temporal-gradient-2 text-on-primary-container p-lg aspect-square flex flex-col justify-between rounded-xl ready-to-glance cursor-default group" ondblclick="this.classList.add('fade-out')" style="opacity: 1; transform: translateY(0px); transition: opacity 0.8s, transform 0.8s;">
<div class="mt-auto">
<span class="font-tile-number-mobile md:font-tile-number text-tile-number-mobile md:text-tile-number block">12</span>
</div>
<p class="font-label-sm text-label-sm opacity-80 uppercase tracking-widest mt-sm">Voyage</p>
</div>
<!-- Tile 3: Méditation (Long Term) -->
<div class="temporal-gradient-3 text-on-secondary p-lg aspect-square flex flex-col justify-between rounded-xl ready-to-glance cursor-default group" ondblclick="this.classList.add('fade-out')" style="opacity: 1; transform: translateY(0px); transition: opacity 0.8s, transform 0.8s;">
<div class="mt-auto">
<span class="font-tile-number-mobile md:font-tile-number text-tile-number-mobile md:text-tile-number block">5</span>
</div>
<p class="font-label-sm text-label-sm opacity-80 uppercase tracking-widest mt-sm">Méditation</p>
</div>
<!-- Tile 4: Presentation (Deep Blue - Far) -->
<div class="temporal-gradient-4 text-on-secondary-container p-lg aspect-square flex flex-col justify-between rounded-xl ready-to-glance cursor-default group" ondblclick="this.classList.add('fade-out')" style="opacity: 1; transform: translateY(0px); transition: opacity 0.8s, transform 0.8s;">
<div class="mt-auto">
<span class="font-tile-number-mobile md:font-tile-number text-tile-number-mobile md:text-tile-number block">42</span>
</div>

</div>

</div>
</section>

<p class="text-on-surface-variant font-label-sm text-label-sm italic opacity-40">

<nav class="fixed bottom-0 w-full z-50 bg-surface-container-low flex justify-around items-center px-xl py-md mb-lg"><a class="text-on-surface-variant p-3 hover:bg-surface-variant rounded-full flex items-center justify-center duration-500 ease-in-out" href="#"><span class="material-symbols-outlined">air</span></a><a class="text-on-surface-variant p-3 hover:bg-surface-variant rounded-full flex items-center justify-center duration-500 ease-in-out" href="#"><span class="material-symbols-outlined">psychology</span></a><a class="text-on-surface-variant p-3 hover:bg-surface-variant rounded-full flex items-center justify-center duration-500 ease-in-out" href="#"><span class="material-symbols-outlined">add_circle</span></a><a class="text-on-surface-variant p-3 hover:bg-surface-variant rounded-full flex items-center justify-center duration-500 ease-in-out" href="#"><span class="material-symbols-outlined">settings</span></a></nav>
<script>
        // Micro-interaction: Smooth entrance
        document.addEventListener('DOMContentLoaded', () => {
            const tiles = document.querySelectorAll('#tile-container > div');
            tiles.forEach((tile, index) => {
                tile.style.opacity = '0';
                tile.style.transform = 'translateY(10px)';
                setTimeout(() => {
                    tile.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
                    tile.style.opacity = '1';
                    tile.style.transform = 'translateY(0)';
                }, index * 100);
            });
        });

        // Double-tap instruction logic (simulated for accessibility)
        console.log("Double-tap any active tile to dismiss it once its time has come.");
    </script>
